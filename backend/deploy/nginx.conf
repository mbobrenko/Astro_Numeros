# /etc/nginx/sites-available/pifagor — serves the static site and proxies /api/*
# to the FastAPI backend running on 127.0.0.1:8000 (see pifagor-api.service).

server {
    listen 80;
    server_name your-domain.example;

    root /opt/pifagor/site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is working over plain HTTP, run:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.example
# to get free HTTPS (required for the Telegram Login Widget and for cookies
# marked `secure`, both of which this backend relies on).
