<title id="pageTitle">Квадрат Пифагора — тест</title>
<style>
  :root{--bg:#faf9f7;--fg:#1f1d1a;--muted:#6b665f;--card:#fff;--line:#e2ded7;--accent:#8a4b2d;--hi:#f3e6dc}
  @media (prefers-color-scheme:dark){:root{--bg:#191816;--fg:#ece8e1;--muted:#a49e94;--card:#232220;--line:#3a3733;--accent:#e0a17c;--hi:#33271f}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
  main{max-width:880px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:28px 0 10px} .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .langbar{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .langbtn{font:inherit;font-size:13px;background:var(--card);color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
  .langbtn.active{background:var(--accent);color:#fff}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
  input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;align-self:end}
  .err{color:#b3261e;margin-top:10px;font-size:14px}
  .hint{color:var(--muted);margin:8px 0 0;font-size:13px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:480px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .grid3 div{padding:18px 8px;text-align:center;font-size:22px;font-weight:600;border:1px solid var(--line);margin:-1px 0 0 -1px;min-height:88px;display:flex;flex-direction:column;justify-content:center}
  .grid3 small{font-size:11px;font-weight:400;color:var(--muted)}
  .grid3 .has{background:var(--hi)}
  table{border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:14px}
  th,td{padding:6px 12px;border:1px solid var(--line);text-align:center} th:first-child,td:first-child{text-align:left}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px} .kv b{font-variant-numeric:tabular-nums}
  .row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
  .txt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 10px}
  .txt h3{margin:0 0 6px;font-size:15px;color:var(--accent)} .txt p{margin:0 0 8px;font-size:14.5px} .none{color:var(--muted);font-size:14px;font-style:italic}
  details{margin-top:12px} summary{cursor:pointer;color:var(--muted);font-size:14px}
  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 18px;flex-wrap:wrap}
  .tabbtn{font:inherit;font-size:15px;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn:hover{color:var(--fg)}
  .tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tabpanel{display:none}
  .tabpanel.active{display:block}
  .price{font-size:20px;font-weight:700;color:var(--accent)}
  .legal p{margin:0 0 10px;font-size:14.5px}
  .legal ol{padding-left:20px;margin:0 0 10px}
  .legal li{margin:0 0 8px;font-size:14.5px}
  .plans{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 10px}
  .plan{flex:1 1 220px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px 20px;position:relative}
  .plan.hl{border-color:var(--accent)}
  .plan .badge{position:absolute;top:-11px;right:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.02em}
  .plan h3{margin:0 0 2px;font-size:16px}
  .plan .plan-price{font-size:26px;font-weight:800;color:var(--accent);margin:6px 0 0}
  .plan .plan-period{font-size:13px;color:var(--muted);margin:0 0 10px}
  .plan .plan-desc{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .plan .plan-feat-label{font-size:12.5px;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
  .plan ul{margin:0;padding-left:18px;font-size:14.5px}
  .plan li{margin:0 0 4px}
  .terms-link{font-size:14.5px}
  .terms-link a{color:var(--accent);font-weight:600;text-decoration:none}
  .terms-link a:hover{text-decoration:underline}
</style>
</head>
<body><main>
<div class="topbar">
  <div>
    <h1 id="h1Title">Квадрат Пифагора по дате и ФИО</h1>
    <p class="sub" id="subText">Дата рождения и ФИО — квадрат Пифагора, периоды жизни и трактовка чисел.</p>
  </div>
  <div class="langbar" id="langbar">
    <button type="button" class="langbtn" data-lang="ru">RU</button>
    <button type="button" class="langbtn" data-lang="en">EN</button>
  </div>
</div>

<form id="f">
  <label><span id="lblSurname">Фамилия</span><input id="s" value="Бобренко" required></label>
  <label><span id="lblName">Имя</span><input id="n" value="Марина" required></label>
  <label><span id="lblPatr">Отчество</span><input id="p" value="Николаевна" required></label>
  <label><span id="lblDate">Дата рождения</span><input id="d" value="22.02.1984" placeholder="ДД.ММ.ГГГГ" required pattern="\d{1,2}\.\d{1,2}\.\d{4}"></label>
  <button id="btnCalc">Рассчитать</button>
</form>
<p class="hint" id="nameHint"></p>
<div class="err" id="err"></div>
<div id="out"></div>
</main>

const LETTER={}; ROWS.forEach((r,i)=>[...r].forEach(c=>LETTER[c]=i+1));

const ROWS_EN=["AJS","BKT","CLU","DMV","ENW","FOX","GPY","HQZ","IR"];

/* транслитерация кириллицы в латиницу — для автозаполнения полей при переключении на английский */
const TRANSLIT_MAP={А:"A",Б:"B",В:"V",Г:"G",Д:"D",Е:"E",Ё:"E",Ж:"Zh",З:"Z",И:"I",Й:"Y",К:"K",Л:"L",М:"M",Н:"N",О:"O",П:"P",Р:"R",С:"S",Т:"T",У:"U",Ф:"F",Х:"Kh",Ц:"Ts",Ч:"Ch",Ш:"Sh",Щ:"Shch",Ъ:"",Ы:"Y",Ь:"",Э:"E",Ю:"Yu",Я:"Ya"};
function translit(w){
  return [...(w||"")].map(ch=>{
    const up=ch.toUpperCase();
    const t=TRANSLIT_MAP[up];
    if(t===undefined)return ch;
    return ch===up?t:(t.charAt(0).toLowerCase()+t.slice(1));

}
const sumDigits=n=>String(n).split("").reduce((a,c)=>a+ +c,0);

function partSums(w,alpha){let a=0,v=0,c=0;for(const ch of w.toUpperCase().replace(/\s/g,"")){const x=alpha.LETTER[ch];if(!x)continue;a+=x;if(alpha.VOWELS.has(ch))v+=x;else if(!alpha.NEUTRAL.has(ch))c+=x}return[a,v,c]}
const mred=(n,mm=[11,22,33])=>{while(n>9&&!mm.includes(n))n=sumDigits(n);return n};
function calc(dateStr,S,N,P,mode,lang){
  const alpha=ALPHA[lang||"ru"];
  const [dd,mm,yy]=dateStr.split(".").map(Number);
  const D=reduce(dd,[]),M=reduce(mm,[]),Y=reduce(yy,[]),d4=reduce(D+M+Y,[]);
  const raw={фамилия:partSums(S,alpha),имя:partSums(N,alpha),отчество:partSums(P,alpha)};
  const table={};for(const k in raw)table[k]=raw[k].map(x=>reduce(x));
  const tot=[0,1,2].map(i=>Object.values(raw).reduce((a,r)=>a+r[i],0));
  const destiny=reduce(tot[0]),soul=reduce(tot[1]),personality=reduce(tot[2]);
  const d5=reduce(destiny,[]),main=reduce(d4+d5,[]);
  const nine=Object.values(table).flat().map(x=>reduce(x,[]));
  let pool=[...nine]; if(mode!=="nine")pool.push(D,M,Y);
  if(mode==="all17")pool.push(...[destiny,soul,personality].map(x=>reduce(x,[])),d4,main);
  const cnt={};pool.forEach(x=>cnt[x]=(cnt[x]||0)+1);

  const P1=mred(M+D),C1=mred(Math.abs(M-D));
  const P2=mred(D+Y),C2=mred(Math.abs(D-Y));
  const P3=mred(P1+P2),C3=mred(Math.abs(C1-C2));

function buildPinnacleChart(pinnacles){

    return p;
  };
  wrap.append(mkPlan(false,s.planFreeName,s.planFreePrice,s.planFreePeriod,s.planFreeDesc,freeFeat));

}
let currentTab="nums";

  const s=T(), THEME=LIB.theme[LANG];
  const o=$("out");o.replaceChildren();
  const tabNums=el("div","tabpanel"),tabGraphs=el("div","tabpanel"),tabTrakt=el("div","tabpanel"),tabInfo=buildInfoTab();

  tabNums.append(el("h2",null,s.hAddNums));

  tabNums.append(g);

  tabGraphs.append(el("h2",null,s.hScore));
  tabGraphs.append(el("p","sub",s.subScore1+r.personalCode+s.subScore2));

  tabGraphs.append(el("h2",null,s.hPeriods));
  tabGraphs.append(el("p","sub",s.subPeriods));

  const fmtV=v=>[11,22,33].includes(v)?v+" ("+mred(v,[])+")":String(v);
  tabGraphs.append(buildPinnacleChart(r.pinnacles));
  const pt=el("table");const ph=el("tr");[s.thAge,s.thTask,s.thProblem].forEach(h=>ph.append(el("th",null,h)));pt.append(ph);
  r.pinnacles.forEach(([a,b,P,C])=>{const tr=el("tr");
    tr.append(el("td",null,a+"–"+(b===96?"96+":b)+s.yearsShort));
    tr.append(el("td",null,fmtV(P)+" — "+themeOf(P)));
    tr.append(el("td",null,fmtV(C)+" — "+themeOf(C)));
    pt.append(tr)});
  tabGraphs.append(pt);
  tabGraphs.append(el("p","sub",s.subPeriodTrakt));
  r.pinnacles.forEach(([a,b,P,C],i)=>{
    const Pk=P<=9?P:mred(P,[]), Ck=C<=9?C:mred(C,[]);
    const b1=textBlock(a+"–"+(b===96?"96+":b)+s.yearsShort+s.taskLabel+fmtV(P)+" ("+THEME[Pk]+")", [GEN.pinnacle_task[String(Pk)]||s.noText]);
    tabGraphs.append(b1);
    if(C>0){const b2=textBlock(s.problemLabel+fmtV(C)+" ("+THEME[Ck]+")", [GEN.pinnacle_challenge[String(Ck)]||s.noText]);tabGraphs.append(b2)}
  });

  // === вкладка «Трактовка»: именные числа, ячейки квадрата ===
  tabTrakt.append(el("h2",null,s.hInterpNums));
  const roleRow=(roleKey,label,value)=>{
    const b=el("div","txt");b.append(el("h3",null,label+" — "+value));
    const gg=GEN.role[roleKey]&&GEN.role[roleKey][String(value)];
    b.append(el("p",null,gg||s.noRoleText(value)));
    tabTrakt.append(b)};
  roleRow("day",s.roleDay,r.D);
  roleRow("lesson",s.roleLesson,r.d4);
  roleRow("soul",s.roleSoul,r.soul);
  roleRow("personality",s.rolePersonality,r.personality);
  roleRow("destiny",s.roleDestiny,r.d5!==r.destiny?r.d5:r.destiny);
  tabTrakt.append(el("h2",null,s.hInterpCells));
  tabTrakt.append(el("p","sub",s.subCells));
  for(let n=1;n<=9;n++){const c=r.cnt[n]||0,tier=String(Math.min(c,4)),head=n+" — "+THEME[n]+" ("+(c?String(n).repeat(c):s.none)+")";
    const b=el("div","txt");b.append(el("h3",null,head));
    const gg=GEN.square_tier[n]&&GEN.square_tier[n][tier];
    b.append(el("p",null,gg||s.noCellText));
    tabTrakt.append(b)}

  // === панель вкладок ===
  const bar=el("div","tabbar");
  const tabs=[["nums",s.tabNums,tabNums],["trakt",s.tabTrakt,tabTrakt],["graphs",s.tabGraphs,tabGraphs],["info",s.tabInfo,tabInfo]];
  const panels={};
  tabs.forEach(([key,label,panel])=>{
    panels[key]=panel;
    const btn=el("button",null,label);btn.type="button";btn.dataset.tab=key;
    btn.addEventListener("click",()=>switchTab(key));
    bar.append(btn);
  });
  o.append(bar);
  tabs.forEach(([key,,panel])=>o.append(panel));
  function switchTab(key){
    currentTab=key;
    bar.querySelectorAll(".tabbtn,button").forEach(b=>b.classList.toggle("active",b.dataset.tab===key));
    tabs.forEach(([k,,panel])=>panel.classList.toggle("active",k===key));
  }
  bar.querySelectorAll("button").forEach(b=>b.className="tabbtn");
  switchTab(tabs.some(([k])=>k===currentTab)?currentTab:"nums");
}
function applyStaticLang(){
  const s=T();
  $("pageTitle").textContent=s.pageTitle; document.title=s.pageTitle;
  $("h1Title").textContent=s.h1;
  $("subText").textContent=s.sub;
  $("lblSurname").textContent=s.lblSurname;
  $("lblName").textContent=s.lblName;
  $("lblPatr").textContent=s.lblPatr;
  $("p").required=(LANG!=="en");
  $("lblDate").textContent=s.lblDate;
  $("d").placeholder=s.datePlaceholder;
  $("btnCalc").textContent=s.btnCalc;
  $("nameHint").textContent=s.nameHint;
  document.documentElement.lang=LANG;
  $("langbar").querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active",b.dataset.lang===LANG));
}
let fieldsByLang={};
$("langbar").addEventListener("click",e=>{
  const b=e.target.closest(".langbtn");if(!b)return;
  const lang=b.dataset.lang; if(lang===LANG)return;
  fieldsByLang[LANG]={s:$("s").value,n:$("n").value,p:$("p").value,d:$("d").value};
  LANG=lang; GEN=GEN_ALL[LANG];
  if(!fieldsByLang[LANG]){
    const src=fieldsByLang.ru||{s:$("s").value,n:$("n").value,p:$("p").value,d:$("d").value};
    fieldsByLang[LANG]=lang==="en"
      ? {s:translit(src.s),n:translit(src.n),p:translit(src.p),d:src.d}
      : {...src};
  }
  const f=fieldsByLang[LANG];
  $("s").value=f.s; $("n").value=f.n; $("p").value=f.p; $("d").value=f.d;
  applyStaticLang();
  $("f").requestSubmit();
});
$("f").addEventListener("submit",e=>{e.preventDefault();$("err").textContent="";
  const s=T();
  const ds=$("d").value.trim(),m=ds.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m||+m[1]<1||+m[1]>31||+m[2]<1||+m[2]>12){$("err").textContent=s.errDate;return}
  const alpha=ALPHA[LANG];
  const hasLetters=w=>[...w.toUpperCase()].some(c=>alpha.LETTER[c]);
  const pVal=$("p").value.trim();
  const pOk=!$("p").required&&pVal===""?true:hasLetters(pVal);
  const bad=!hasLetters($("s").value)||!hasLetters($("n").value)||!pOk;
  if(bad){$("err").textContent=s.errLetters;return}
  $("err").textContent="";
  render(calc(ds,$("s").value,$("n").value,$("p").value,"all17",LANG));
});
applyStaticLang();
$("f").requestSubmit();
</script>
